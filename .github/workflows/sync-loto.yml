name: Actualizar resultados LotoHope

on:
  schedule:
    - cron: '*/10 3-6 * * 4,0'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lotohope-results
  cancel-in-progress: true

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Consultar resultados
        run: node scripts/sync-loto.mjs
