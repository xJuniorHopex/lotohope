name: Actualizar resultados LotoHope

on:
  schedule:
    - cron: '0 3 * * 3,6'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lotoh​​ope-results
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependencias
        run: npm install

      - name: Consultar y registrar resultados
        run: node scripts/sync-loto.js
