name: Sincronizar resultados LotoHope

on:
  schedule:
    # 11:00 p. m. en República Dominicana (UTC-4), con reintentos cada 10 min.
    # Jueves UTC = miércoles local; domingo UTC = sábado local.
    - cron: '*/10 3-6 * * 4,0'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lotohope-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Consultar resultados y actualizar JSON
        run: node scripts/sync-loto.mjs

      - name: Guardar cambios en GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/resultados.json
          if git diff --cached --quiet; then
            echo "No hay cambios nuevos que guardar."
          else
            git commit -m "Actualizar resultados de LotoHope"
            git push
          fi
